spring.application.name=api-gateway
server.port=8080

# ===================================================================
# CÁCH 1: Cấu hình AddResponseHeader Filter trong application.properties
# ===================================================================
# Cách 1a: Áp dụng AddResponseHeader làm default-filter cho toàn bộ request
spring.cloud.gateway.default-filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System

# Cách 1b: Cấu hình Route ví dụ với AddResponseHeader Filter
spring.cloud.gateway.routes[0].id=customer-service-route
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/customers/**
spring.cloud.gateway.routes[0].filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System
